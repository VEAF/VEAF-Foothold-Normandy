# mission.yaml — generated by veaf-tools convert-other on 2026-07-28 12:01
# Third-party mission adopted onto the v6 toolchain. See ADR 0007.
# Review before building: enable the VEAF modules you need and check the
# custom_scripts load order below.

# Marks this mission as adopted with the named profile; validate/build
# enforce the profile's module incompatibilities.
conversion_profile: foothold-ww2

# Name of the built .miz (per map — not part of the shared config).
mission:
  name: VEAF_Foothold_Normandy_ICAO_LFRK   # _ICAO_LFRK lu par RealWeather (Caen-Carpiquet)
  silence_atc_on_all_airbases: true   # as the v5 VEAF_common.lua did

global_log_level: info

# Scripts found in the source mission's native load triggers, in load order.
# Injected as custom_scripts and loaded by VEAF-generated triggers
# (generate_load_trigger defaults to true).
custom_scripts:
  scripts:
    - path: src/scripts/Moose.lua
    - path: src/scripts/Foothold_Localization.lua
    - path: "src/scripts/Foothold Config WW2.lua"
    - path: src/scripts/zoneCommander.lua
    - path: src/scripts/Normandy_Zone_Setup.lua
    - path: src/scripts/WelcomeMessage.lua
    - path: src/scripts/EWRS.lua
    - path: src/scripts/Splash_Damage.lua
    - path: src/scripts/zeus_Full_v2.1.lua
    - path: src/scripts/AIEN.lua

# Native load triggers detected in the source .miz. The build removes these
# so the scripts above are not loaded twice.
strip_native_triggers:
  - "Loader 1"
  - "Loader 2"
  - "add scripts"
  - "AIEN"

# Partial override of the untouched upstream config. Uncomment and adjust;
# layered on top of Foothold Config WW2.lua (only restates what you change). See ADR 0008.
# config_override:
#   target: "Foothold Config WW2.lua"
#   values:
#     CapDifficulty: medium
#     AutoRestart: false
#     FootholdLocale: FR

# Password protection, as the v5 mission had. Hashes are SHA-1 — that is what
# veafSecurity._checkPassword computes from what the player types.
#   password_hashes    -> "veaf_foothold_2026"
#   password_mm_hashes -> "veaf_foothold_gamemaster"
security:
  disabled: false
  password_hashes:
    - "2a4efd2397e081bcacb82b3e447c584c65cc83ee"
  password_mm_hashes:
    - "99685b3c7cb1fb08a829fc97d4a8564fc5f9435a"

# VEAF modules — from the 'foothold' conversion profile.

# VEAF modules — from the 'foothold-ww2' conversion profile.
modules:
  # ── Infrastructure ──
  UNITS:
  TIME:
  CACHE:
  EVENTS:
  MARKERS:
  COMMANDS:
  MIST:  # MiST community lib — mandatory (VEAF dependency)
  # ── Core ──
  RADIO:
    enabled: true
    init:
      create_menus: false  # no VEAF F10 menu: commands go through protected markers
  SPAWN: true
  SHORTCUTS: true  # built-in aliases (-shilka, -sa2, …)
  SECURITY: true
  # ── Features ──
  WEATHER: true
  REMOTE: true
  # ── Community scripts OFF ──
  # Disabled by the 'foothold-ww2' profile: this mission ships its own
  # (Moose, its own CTLD, AIEN, …); VEAF's bundled versions stay off.
  stts: false
  aien: false
  csar: false
  hercules: false
  skynet: false
  tum: false

# One .miz per mission: no weather variants (the weather step would emit one per
# version declared in src/versions.yaml).
pipeline:
  weather: false

# Partial override of the untouched upstream config (ADR 0008). Values synced from
# the reference mission; target is this mission's own.
config_override:
  target: "Foothold Config WW2.lua"
  values:
    FootholdLocale: FR       # on-screen Foothold messages in French
    CapDifficulty: medium    # RED CAP amount
    AutoRestart: false       # let players choose to restart from the radio menu

# ── Build configuration ─────────────────────────────────────────────────────
# Persisted build settings — set via --dev-mode / --scripts-path CLI flags.
# Note: scripts_path is usually machine-specific.
#
build:
  dev_mode: false
